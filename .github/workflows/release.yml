name: Release NaviBee
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag (e.g. v1.0.1)', required: true, default: 'v1.0.1' }
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          $ver = $tag.TrimStart('v')
          $zip = "release/NaviBee_v$ver.zip"; $dll = "release/mb_NaviBee.dll"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $zip $dll --clobber }
          else { gh release create $tag $zip $dll --title "NaviBee $tag" --generate-notes }
